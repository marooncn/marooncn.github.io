bio:
  - "现任**比亚迪新技术研究院端到端开发部具身大脑负责人**（团队 34 人），负责具身模型研发、部署、落地场景及数采方案。此前担任比亚迪智驾端到端规划模型 & VLA 模型负责人，从零组建团队并实现一段式端到端规划模型一年内量产；曾任百度 Apollo 萝卜快跑高速高架 PNC 场景负责人、阿里巴巴达摩院 AD Lab 决策规划算法工程师。"
  - "2019 年获哈尔滨工业大学硕士学位（机器人技术与系统国家重点实验室），2017 年获同济大学机械电子（机器人）学士学位。"
  - 研究兴趣： Physical AI、强化学习、世界模型。
