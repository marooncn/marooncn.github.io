- period: 2023.07 – 2024.10
  org: 百度 · IDG · Apollo
  role: 萝卜快跑高速高架 PNC 场景负责人、技术主管
  summary: 构建基于学习的交互决策算法、推进 Neural Planner，使萝卜快跑成为**[首个实现智能网联汽车横跨长江贯通示范运营](https://mp.weixin.qq.com/s/XdAxGcLq0yqrb5Nn3tXjJQ)**、**[首个开通机场自动驾驶接驳的全无人自动驾驶汽车](https://mp.weixin.qq.com/s/-h8s9nHA8rry8FY6J4Oe3Q)**。
  projects:
    - title: 交互推演框架 2.0
      summary: 支持多场景、多障碍物博弈的交互推演框架，应用于跨线 Nudge、匝道汇入及高速换道场景，显著提升自车强交互能力。
      items:
        - "基于纵向博弈的交互推演：将推演从 ST 扩展到 S-L-T 空间，按横向侵入程度分层考虑交互障碍物，并对潜在来车构建 mock 障碍物，推演他车对自车行为的 best response，用于拥堵场景下的跨线 Nudge；"
        - "基于预测概率分布的交互推演建模：针对匝道他车汇入的预测不确定性，将纵向推演从单条预测轨迹扩展到概率分布域：在汇入区间采样汇入点，代入预测的二维正态分布求解在各区间汇入的概率，投影到自车 ST 图后对每段求解让行 / 抢行（Yield / Overtake）决策，以期望代价选出最优决策与轨迹，并评估相反决策下的最低代价作为安全兜底；对不遵循社会兼容行为的他车，通过观测-修正逼近均衡解。"
      media:
        - { src: img/baidu-nudge-slt.jpg, caption: 拥堵场景跨线 Nudge 的 S-L-T 交互推演, wide: true }
        - { src: img/baidu-merge-distribution-h.jpg, caption: 他车汇入点的概率分布, wide: true }

    - title: 基于学习的交互决策
      summary: 开发基于策略优先级的纵向决策链路，训练基于集成学习的切车决策器。

    - title: Neural Planner
      summary: 开发基于学习的端到端规划预测联合决策器，提供高阶先验与轨迹筛选，与交互推演框架配合。

