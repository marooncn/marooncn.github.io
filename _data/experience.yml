- period: 2024.11 – 至今
  org: 比亚迪 · 新技术研究院
  role: 智驾端到端规划模型 & VLA 模型负责人
  summary: "从零到一组建团队，完成从数据闭环、模型设计到工程落地、量产迭代的全过程，推动比亚迪智驾自研水平从行业末流跃升至前列；为行业内**[首个承诺智驾兜底](https://www.byd.com/cn/detail626)**的方案提供关键技术支撑。"
  projects:
    - title: 一段式端到端规划模型
      summary: "一年内实现量产。以多项自研算法解决上游特征不稳、模态难定义及散度不足、导航成功率与智能性矛盾、低频场景泛化差等难点。"
      works:
        - title: EMoE-Planner
          subtitle: 显式混合专家的纯学习规划模型
          links:
            - { name: arXiv, url: "https://arxiv.org/abs/2505.12311" }
          summary: "面向城市场景中轨迹多模态难建模、单一专家难以覆盖多样场景、交互考虑不足等问题的纯学习规划模型。nuPlan 闭环得分第一（Val14 **93.06**），成为首个在 nuPlan 闭环仿真中超过规则方法的纯学习模型。"
          items:
            - "**Explicit MoE**：以语义明确的 Scene Router 替代传统 MoE 的黑盒路由，按场景显式分配专家，降低单个专家的学习难度，并可直接通过数据配比控制负载均衡；"
            - "**Scene-specific Query**：按识别出的场景选择对应的终点锚点作为多模态先验，把输出限制在合理的驾驶行为内，提高轨迹质量下限；"
            - "**Interaction-Oriented Loss**：在损失计算与他车预测中显式考虑自车与他车的交互，降低密集交通中的碰撞率。"
          media:
            - { src: img/byd-emoe-framework.png, caption: EMoE-Planner 框架, wide: true }

    - title: VLA 模型
      items:
        - 构建基于关键帧及因果决策的 VQA 数据集；
        - 面向 Physical AI 改进 Flow Matching，满足连续决策、时序一致性与物理约束，推理耗时降低一半以上，模态稳定性与轨迹平滑性显著提升；
        - 构建带Pixel-based正则约束Latent World Model和基于 LWM 的 RL Post-training;
      works:
        - title: HyWorldVLA
          subtitle: 融合像素与隐空间世界建模的 VLA 模型
          links:
            - { name: arXiv, url: "https://arxiv.org/abs/2607.20988" }
          summary: "像素级未来预测对场景噪声敏感，隐空间世界模型又缺少像素级约束、可解释性差。HyWorldVLA 将两者结合，在 NAVSIM v1 / v2 上达到 SOTA（**90.6** / **89.7**），场景噪声鲁棒性提升 20 余点。"
          media:
            - { src: img/byd-hyworldvla-framework.jpg, caption: HyWorldVLA 框架：视频世界模型的隐表征监督 VLM 预训练与 VLA 协同微调, wide: true }

