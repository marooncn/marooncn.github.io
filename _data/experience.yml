    - title: 交互推演框架1.0
      summary: "面向无保护左转、匝道汇入等强交互场景，搭建「自车语义候选轨迹采样 → 他车最优交互响应 → 舒适性 + 安全性 Cost 评估」的交互推演模型：按 Yield / Not Yield 语义并结合预推演生成自车候选轨迹，在 ST 图中求解每条候选下他车的最优交互轨迹，选出安全舒适、符合他车预期的最优解；透传 Normal / Warning / Danger 推演状态，与横向及后决策联动调整汇入点或切换 Fallback 轨迹。无保护左转线上 Bad Case 通过率由 77.1% 提升至 **90.8%**。"
      media:
        - { src: img/ali-interaction-framework.png, caption: 交互推演模型框架, wide: true }

- period: 2018.07 – 2018.10
  org: 微软亚洲研究院 · 多媒体计算组（Media Computing）
  role: 研究实习生
  summary: 强化学习在语音传输中的应用：根据网络状况与语音信息，用 RL 动态决策传输 buffer 大小，平衡时延（buffer 过大）与丢包（buffer 过小）；参与从算法设计、实现到工程优化的全过程，方案已应用于相关产品。
